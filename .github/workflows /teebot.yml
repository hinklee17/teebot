name: Tee time watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub may run it late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Find times but don't book"
        type: boolean
        default: true

concurrency:
  group: teebot          # never run two checks at once (prevents double-booking)
  cancel-in-progress: false

permissions:
  contents: write        # to commit state.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check tee sheet
        env:
          CLUB_USERNAME: ${{ secrets.CLUB_USERNAME }}
          CLUB_PASSWORD: ${{ secrets.CLUB_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || vars.DRY_RUN }}
        run: python -m teebot.bot

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "teebot"
            git config user.email "teebot@users.noreply.github.com"
            git add state.json
            git commit -m "Update booking state"
            git pull --rebase && git push
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 3
